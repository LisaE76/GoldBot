; ===== Signal Bot configuration (XAUUSD, GBPUSD, EURUSD) =====

[data]
; Free key from https://twelvedata.com (800 requests/day is plenty)
twelvedata_api_key = YOUR_TWELVEDATA_KEY
; Pairs and timeframes to watch. Each pair+timeframe gives its own signals.
; Timeframes available: 5min, 1h, 1day
symbols = XAU/USD, GBP/USD, EUR/USD
timeframes = 5min, 1h, 1day
; Hours (UK time, weekdays) when the 5-minute chart is checked. Outside these
; hours 5-min signals are off. Keeps within the free plan's 800 requests/day.
m5_hours = 7-21

[account]
; Account balance, its currency (GBP or USD), and target % risked per trade
balance = 52
account_currency = GBP
risk_percent = 2.0
; If even the minimum lot risks more than this % of the account, the signal
; is still sent but flagged HIGH RISK. Set skip_over_max = true to not send it.
max_risk_percent = 10
skip_over_max = false
; GBP->USD rate used if the live rate can't be fetched (USD per 1 GBP)
fx_fallback = 1.33
; Contract size per standard lot, by pair (check your broker):
;   gold: 100 oz (0.01 lot = $1 per $1 move)
;   forex: 100,000 units (0.01 lot = $0.10 per pip)
min_lot = 0.01
lot_step = 0.01
max_lot = 50

[strategy]
; 5-min stops are never tighter than this many times the spread
min_stop_spreads = 4
; Take-profit levels as multiples of the stop distance (R)
tp1_r = 1.5
tp2_r = 3.0
; Stop tracking a signal after this many hours, per timeframe
expiry_hours_5min = 8
expiry_hours_1h = 48
expiry_hours_1day = 240

[XAU/USD]
contract_size = 100
decimals = 2
pip = 0.1
; typical spread, used by the backtester as a cost
spread = 0.30
news_currencies = USD

[GBP/USD]
contract_size = 100000
decimals = 5
pip = 0.0001
spread = 0.00015
news_currencies = GBP, USD

[EUR/USD]
contract_size = 100000
decimals = 5
pip = 0.0001
spread = 0.00012
news_currencies = EUR, USD

[news]
enabled = true
; Currencies whose events trigger heads-up alerts. Each pair only pauses
; signals for its own currencies (see news_currencies above).
currencies = USD, GBP, EUR
; High, or High,Medium
impacts = High
; No new signals this many minutes before/after a matching event
blackout_before_min = 30
blackout_after_min = 30
; Send a heads-up message this many minutes before a high-impact event
heads_up_min = 60

[sms]
; How alerts are delivered: telegram (free) or twilio (paid SMS)
provider = telegram

; --- Telegram (free) ---
; Bot token from @BotFather, and your chat ID from @userinfobot
telegram_bot_token = YOUR_BOT_TOKEN
; One or more chat IDs, comma separated
telegram_chat_id = YOUR_CHAT_ID

; --- Twilio SMS (only if provider = twilio) ---
; https://www.twilio.com  (Account SID, Auth Token, and a Twilio number)
account_sid = YOUR_TWILIO_SID
auth_token = YOUR_TWILIO_TOKEN
from_number = +10000000000
; One or more numbers in international format, comma separated.
; For WhatsApp use e.g. whatsapp:+447700900000 (and a whatsapp: sender)
to_numbers = +447700900000
; true = print messages instead of sending them (use for testing)
dry_run = true

[general]
timezone = Europe/London
check_interval_min = 5
state_file = state.json
; Daily "bot running" message on weekdays, at or after this hour (local time).
; Set to -1 to turn it off.
heartbeat_hour = 7
