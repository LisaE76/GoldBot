; ===== XAUUSD Signal Bot configuration =====

[data]
; Free key from https://twelvedata.com (800 requests/day is plenty)
twelvedata_api_key = YOUR_TWELVEDATA_KEY
symbol = XAU/USD

[account]
; Account balance, its currency (GBP or USD), and target % risked per trade
balance = 52
account_currency = GBP
risk_percent = 2.0
; If even the minimum lot risks more than this % of the account, the signal
; is still sent but flagged HIGH RISK. Set skip_over_max = true to not send it.
max_risk_percent = 10
skip_over_max = false
; GBP->USD rate used if the live rate can't be fetched (USD per 1 GBP)
fx_fallback = 1.33
; Broker contract spec for XAUUSD (standard: 1 lot = 100 oz -> $1 move = $100/lot)
; Check your broker's spec; some use 10 or 1 oz.
contract_size = 100
min_lot = 0.01
lot_step = 0.01
max_lot = 50

[strategy]
; Take-profit levels as multiples of the stop distance (R)
tp1_r = 1.5
tp2_r = 3.0
; Typical spread in USD, used by the backtester as a cost
spread = 0.30
; Cancel tracking of a signal after this many hours
signal_expiry_hours = 48

[news]
enabled = true
; Gold is driven mainly by USD data (CPI, NFP, FOMC, PCE, GDP...)
currencies = USD
; High, or High,Medium
impacts = High
; No new signals this many minutes before/after a matching event
blackout_before_min = 30
blackout_after_min = 30
; Send a heads-up SMS this many minutes before a high-impact event
heads_up_min = 30

[sms]
; How alerts are delivered: telegram (free) or twilio (paid SMS)
provider = telegram

; --- Telegram (free) ---
; Bot token from @BotFather, and your chat ID from @userinfobot
telegram_bot_token = YOUR_BOT_TOKEN
; One or more chat IDs, comma separated
telegram_chat_id = YOUR_CHAT_ID

; --- Twilio SMS (only if provider = twilio) ---
; https://www.twilio.com  (Account SID, Auth Token, and a Twilio number)
account_sid = YOUR_TWILIO_SID
auth_token = YOUR_TWILIO_TOKEN
from_number = +10000000000
; One or more numbers in international format, comma separated.
; For WhatsApp use e.g. whatsapp:+447700900000 (and a whatsapp: sender)
to_numbers = +447700900000
; true = print messages instead of sending them (use for testing)
dry_run = true

[general]
timezone = Europe/London
check_interval_min = 15
state_file = state.json
