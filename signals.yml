# GitHub Actions workflow: runs the XAUUSD bot every 15 minutes, Mon-Fri.
# Must live at .github/workflows/signals.yml in your repository.
name: XAUUSD signals

on:
  schedule:
    # Times are UTC. A couple of minutes after each 15-min bar closes.
    - cron: "2,17,32,47 * * * 1-5"
  workflow_dispatch:
    inputs:
      test_sms:
        description: "Send a test text instead of checking for signals"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          SMS_TO: ${{ secrets.SMS_TO }}
          ACCOUNT_BALANCE: ${{ secrets.ACCOUNT_BALANCE }}
          DRY_RUN: "false"
        run: |
          if [ "${{ inputs.test_sms }}" = "true" ]; then
            python main.py --test-sms
          else
            python main.py --once
          fi

      - name: Save bot memory (open trade, alerts sent)
        if: ${{ inputs.test_sms != true }}
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update bot state" && git push)
