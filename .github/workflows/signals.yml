# GitHub Actions workflow for the signal bot. Started every 5 minutes by
# cron-job.org (see SETUP_PHONE.md); GitHub's own schedule below is a backup.
# Must live at .github/workflows/signals.yml in your repository.
name: XAUUSD signals

on:
  schedule:
    # Backup only (UTC). GitHub often starts these late; the bot catches up.
    - cron: "3,33 * * * 1-5"
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        default: "Check for signals"
        options:
          - "Check for signals"
          - "Send test message"
          - "Setup check"
          - "Run backtest"
          

permissions:
  contents: write

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      

      - name: Run bot
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          SMS_TO: ${{ secrets.SMS_TO }}
          ACCOUNT_BALANCE: ${{ secrets.ACCOUNT_BALANCE }}
          DRY_RUN: "false"
        run: |
          if [ "${{ inputs.action }}" = "Setup check" ]; then
            python setup_check.py
          elif [ "${{ inputs.action }}" = "Send test message" ]; then
            python main.py --test-sms
          elif [ "${{ inputs.action }}" = "Run backtest" ]; then
            python backtest.py --all
            
          else
            python main.py --once
          fi

      - name: Save bot memory (open trade, alerts sent)
        if: ${{ !inputs.action || inputs.action == 'Check for signals' }}
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -q -m "Update bot state"
            git pull -q --rebase -X theirs || true
            git push -q || echo "Could not save state this time; will retry next run."
          fi
